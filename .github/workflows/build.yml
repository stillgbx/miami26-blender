name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The committed themes must match the generator.
      - name: Check generated themes
        run: |
          python tools/generate-themes.py
          git diff --exit-code -- extensions

      - name: Build extensions
        run: python tools/build-extensions.py

      - uses: actions/upload-artifact@v7
        with:
          name: miami26-blender
          path: dist/*.zip

      # Pushing a tag such as v1.1.0 publishes a GitHub release with the four extension zips attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
